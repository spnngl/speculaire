# cargo-nextest, for `just check`, `just cov` and cargo-mutants; `e2e/` keeps `cargo test`, which runs its test
# binaries one after another (D72).
[profile.default]
# A hung test fails with its name after 2 minutes, and its process group dies with it, `speculaire agent` included.
slow-timeout = { period = "30s", terminate-after = 4 }
# A test whose child still holds the test's stdout or stderr 500 ms after it ends fails.
leak-timeout = { period = "500ms", result = "fail" }
