[package]
name = "e2e"
description = "The e2e suites: kind clusters made by `just e2e-up`, driven through kubectl and docker exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The agent's metrics in the protobuf exposition, the only one with native histograms (D34).
prost.workspace = true
# The certificates of the Bearer registry that the relay suite pulls from.
rcgen.workspace = true
# The manifests the harness pushes to its upstreams, and zot'"'"'s access log.
serde_json.workspace = true
# The recorded Sigstore fixtures (D141), read as discovery records them, and their signers.
speculaire-artifacts = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[dev-dependencies]
# The platform of the nodes, whose manifest a pull picks from an image index.
speculaire-oci.workspace = true
