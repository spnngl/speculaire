# Docker Hub through its mirrors (D120): mirror.gcr.io, then the official images on public.ecr.aws/docker, then Docker
# Hub, whose anonymous pulls a CI runner shares a rate limit for. CRI-O tries the mirrors in order, then the location.
[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry.mirror]]
location = "mirror.gcr.io"

[[registry.mirror]]
location = "public.ecr.aws/docker"
