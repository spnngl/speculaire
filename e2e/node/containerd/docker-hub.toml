# Docker Hub through its mirrors (D120): mirror.gcr.io, then the official images on public.ecr.aws/docker, then Docker
# Hub, whose anonymous pulls a CI runner shares a rate limit for. containerd tries the hosts in order, then the server.
server = "https://registry-1.docker.io"

[host."https://mirror.gcr.io"]
capabilities = ["pull", "resolve"]

# The path is the registry's root: with `override_path`, containerd appends no `/v2`.
[host."https://public.ecr.aws/v2/docker"]
capabilities = ["pull", "resolve"]
override_path = true
