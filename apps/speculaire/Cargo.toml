[package]
name = "speculaire"
description = "P2P image mirror and supply-chain gate for containerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
speculaire-agent.workspace = true
speculaire-configure.workspace = true
speculaire-runtime.workspace = true
speculaire-verify.workspace = true

[dev-dependencies]
rustls.workspace = true
secrecy.workspace = true
speculaire-artifacts = { workspace = true, features = ["testing"] }
speculaire-fake-runtime.workspace = true
speculaire-load.workspace = true
speculaire-oci.workspace = true
speculaire-pki = { workspace = true, features = ["testing"] }
speculaire-reflect.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# D46: the global allocator on musl, `src/main.rs`.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

# D203: transparent huge pages off, `src/main.rs`.
[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true

[lints]
workspace = true
