# Ported from dedens `taplo.toml` at v0.1.0-131-gfd00747 (D57).
# cargo-vet writes supply-chain/ in its own format, and rewrites it on each command.
exclude = [
  "**/Cargo.lock",
  "**/target/**",
  "plan/**",
  "fuzz/seeds/**",
  # Copies of containerd's own files, which stay as they are.
  "**/tests/data/**",
  "supply-chain/**",
]
