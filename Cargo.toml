[workspace]
resolver = "3"
# apps/: binaries; crates/: libraries (D62).
members = ["apps/*", "crates/*", "e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# D57: the oldest stable `just msrv` checks; the build itself uses rust-toolchain.toml's pin.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/spnngl/speculaire"
publish = false

[workspace.dependencies]
speculaire-agent = { path = "crates/agent" }
speculaire-fake-runtime = { path = "crates/fake-runtime" }
speculaire-mirror = { path = "crates/mirror" }
speculaire-oci = { path = "crates/oci" }
speculaire-oracle-harness = { path = "crates/oracle-harness" }
speculaire-pki = { path = "crates/pki" }
speculaire-registry = { path = "crates/registry" }
speculaire-registry-config = { path = "crates/registry-config" }
speculaire-runtime = { path = "crates/runtime" }
speculaire-configure = { path = "crates/configure" }
anyhow = "1.0.104"
# D88: the digests of the relay, on the provider that rustls uses (D13).
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "tokio",
] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
# D5: the content service of containerd, the fallback of the content directory.
containerd-client = "0.9.0"
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = [
  "http1",
  "server",
] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
humantime = "2.4.0"
insta = "1.49.0"
metrics = "0.24.6"
# D34: no HTTP listener or push gateway of its own; `protobuf` for native histograms.
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = [
  "protobuf",
] }
mime = "0.3.18"
percent-encoding = "2.3.2"
# D81: the platform of an image index is oci-spec's; the reference is ours.
oci-spec = { version = "0.10.0", default-features = false, features = [
  "image",
] }
# D14: the local CA and certificates of the mirror, generated with the aws-lc-rs provider (D13).
rcgen = { version = "0.14.10", default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }
# D14: the mirror speaks TLS 1.3 only, with client authentication, on aws-lc-rs (D13); `tls12` is for the upstream
# client alone (D88), and the mirror's server config names TLS 1.3 itself.
rustls = { version = "0.23.46", default-features = false, features = [
  "aws-lc-rs",
  "std",
  "tls12",
] }
# D39: readiness, stopping and the watchdog.
sd-notify = "0.5.0"
# D88: the system's trusted roots, as Go reads them for containerd and CRI-O.
rustls-native-certs = "0.8.5"
# D37: every credential and header value is a `SecretString`: it never prints, in `Debug` or in a log.
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
time = { version = "0.3.55", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "aws-lc-rs",
] }
tokio-util = { version = "0.7.20", features = ["io"] }
prost = "0.14.5"
tonic-prost = "0.14.9"
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = "1.2.1"
# D32: edits keep the admin comments and order.
toml_edit = "0.25.19"
# The low-level parser of `toml`: the order of a file's tables, which the typed result does not keep.
toml_parser = "1.1.5"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
# D14: reads the validity and names of the certificates `configure` made.
x509-parser = { version = "0.18.1", default-features = false, features = [
  "verify-aws",
] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
  "std",
] }
# D46: the global allocator of the musl binaries, `MI_SECURE=4` (guard pages, randomised and encoded free lists).
mimalloc = { version = "0.1.52", features = ["secure"] }

# Ported from dedens `Cargo.toml` at v0.1.0-131-gfd00747 (D13): the same lints, without dedens' own cfgs.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# selected restriction
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
