# typos: `just check`.
[files]
# Fuzz seeds are misspelt on purpose, and tests/data holds upstream copies as they are.
extend-exclude = ["plan/", "fuzz/seeds/", "**/tests/data/"]

[default]
# "ANDed": "AND" in capitals, then a suffix.
extend-ignore-re = ["\\bANDed\\b"]

[default.extend-words]
# Azure Kubernetes Service.
AKS = "AKS"
# hax, the Rust verification toolchain.
hax = "hax"
# The in-toto Rekor entry type.
intoto = "intoto"
# D30's example of a misspelt key.
unmached = "unmached"
