# typos: `just check`.
[files]
# Fuzz seeds are misspelt on purpose; tests/data, the recorded fixtures and the initial TUF root hold upstream bytes as
# they are.
extend-exclude = [
  "plan/",
  "fuzz/seeds/",
  "**/tests/data/",
  "fixtures/**/*.json",
  "fixtures/sigstore/layouts/",
  "crates/verify/src/tuf_root.json",
]

[default]
# "ANDed": "AND" in capitals, then a suffix.
# "YWxpY2U6cHctN2IyZDkw": the Base64 of a test login, which the redaction test looks for in the log.
extend-ignore-re = ["\\bANDed\\b", "\\bYWxpY2U6cHctN2IyZDkw\\b"]

[default.extend-words]
# Azure Kubernetes Service.
AKS = "AKS"
# Base64 test vectors of RFC 4648: "fo" is "Zm8=".
fo = "fo"
# hax, the Rust verification toolchain.
hax = "hax"
# The in-toto Rekor entry type.
intoto = "intoto"
# D30's example of a misspelt key.
unmached = "unmached"
