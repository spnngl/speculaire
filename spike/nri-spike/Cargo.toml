[package]
name = "nri-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
containerd-client = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
ttrpc = { version = "0.10", default-features = false, features = ["async", "prost"] }

[build-dependencies]
ttrpc-codegen-prost = "0.1"
