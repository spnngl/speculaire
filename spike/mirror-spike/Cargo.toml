[package]
name = "mirror-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
hex = "0.4"
rcgen = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
x509-parser = "0.18"
