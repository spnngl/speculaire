kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
containerdConfigPatches:
  # The node image has no config_path, and sets discard_unpacked_layers = true, which drops layers from the
  # content store after unpack (D15 preflight refuses it).
  - |
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
    [plugins."io.containerd.grpc.v1.cri".containerd]
      discard_unpacked_layers = false
kubeadmConfigPatches:
  # Step 03 needs a fast kubelet certificate rotation: the signer caps the lifetime at 10 minutes.
  # kind v0.33.0 writes kubeadm v1beta3 below Kubernetes 1.36, where extraArgs is a map (see kind-crio.yaml).
  - |
    apiVersion: kubeadm.k8s.io/v1beta4
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        - name: cluster-signing-duration
          value: 10m
  - |
    apiVersion: kubeadm.k8s.io/v1beta3
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        cluster-signing-duration: 10m
