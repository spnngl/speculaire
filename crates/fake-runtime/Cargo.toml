[package]
name = "speculaire-fake-runtime"
description = "A fake containerd or CRI-O on a Unix socket, for the tests of what the agent asks its runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fake-runtime"
path = "src/main.rs"

[dependencies]
containerd-client.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["http1", "http2", "server-auto"] }
prost.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync"] }
tonic-prost.workspace = true
tower.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
