[package]
name = "speculaire-artifacts"
description = "The artifact store, and discovery of the artifacts of the images a node lists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The recorded Sigstore fixtures (D141) loaded into a store, for other crates' tests.
testing = ["dep:tempfile"]

[dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
speculaire-mirror.workspace = true
speculaire-oci.workspace = true
speculaire-registry.workspace = true
speculaire-runtime.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
metrics-exporter-prometheus.workspace = true
speculaire-pki = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
