[package]
name = "speculaire-nri"
description = "An NRI plugin without a runtime: the multiplexer, ttrpc's unary calls and NRI's plugin protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# D168: NRI's runtime side, for the tests of a plugin where there is no runtime.
testing = []

[dependencies]
futures-util.workspace = true
prost.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync", "time"] }
# D107: the frame and ttrpc headers, read in place.
zerocopy = { workspace = true, features = ["derive"] }

[build-dependencies]
prost-build.workspace = true

[dev-dependencies]
# D189: the seeded requests the borrowed reader is compared with prost on.
fastrand.workspace = true
speculaire-oracle-harness.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "test-util",
  "time",
] }

# D163: the queues' lock in the tests of `just shuttle`.
[target.'cfg(shuttle)'.dev-dependencies]
shuttle.workspace = true

[lints]
workspace = true
