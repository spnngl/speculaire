# Ported from dedens `clippy.toml` at v0.1.0-131-gfd00747 (D13).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Product names and NRI's `ConnID` and `CreateContainer`, not code (D150, D163, D166).
doc-valid-idents = ["BuildKit", "CycloneDX", "ConnID", "CreateContainer", ".."]
