# Ported from dedens `fuzz/Cargo.toml` at v0.1.0-131-gfd00747 (D27): a workspace of its own, so that libFuzzer's
# nightly build never touches the main workspace's lock file.
[package]
name = "speculaire-fuzz"
description = "Fuzz targets: one per parser of outside data"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# One target per parser of outside data. Each file in `fuzz_targets/` is a one-line shim over the function of the
# same name in `src/`, which `cargo test --lib` also drives on stable with the seeds (`just fuzz-smoke`).

[dependencies]
libfuzzer-sys = "0.4.13"
speculaire-agent = { path = "../crates/agent" }
speculaire-mirror = { path = "../crates/mirror" }
speculaire-oci = { path = "../crates/oci" }
speculaire-registry = { path = "../crates/registry" }
speculaire-registry-config = { path = "../crates/registry-config" }
speculaire-runtime = { path = "../crates/runtime" }
# `token_answer` reads the token it parsed; the same version as the workspace's.
secrecy = "0.10.3"
# `containerd_config` reads files: it writes the input to a temporary directory.
tempfile = "3.27.0"
# The serializer of the round trip in `config`; the same version as the workspace's.
toml = "1.2.1"

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_values"
path = "fuzz_targets/config_values.rs"
test = false
doc = false
bench = false

[[bin]]
name = "containerd_config"
path = "fuzz_targets/containerd_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hosts_toml"
path = "fuzz_targets/hosts_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hosts_edit"
path = "fuzz_targets/hosts_edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mirror_request"
path = "fuzz_targets/mirror_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crio_inspect"
path = "fuzz_targets/crio_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "runtime_version"
path = "fuzz_targets/runtime_version.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registries_conf"
path = "fuzz_targets/registries_conf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auth_json"
path = "fuzz_targets/auth_json.rs"
test = false
