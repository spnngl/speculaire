# Ported from dedens `.cargo/mutants.toml` at v0.1.0-131-gfd00747 (D103 there; D27, D74 here).
#
# cargo-mutants: run with `just mutants` or `just mutants-diff`, never bare.
# Test with every feature, so no test behind a feature goes unseen.
all_features = true
# nextest, as `just check` (D72): a test that hangs on a mutant is killed after 2 minutes and counts as caught.
test_tool = "nextest"
# Every package's tests run for each mutant: `apps/speculaire/tests/agent.rs` starts the binary and is what sees
# `crates/agent/src/serve.rs` and `systemd.rs`, which that package's own tests never reach (D74).
test_workspace = true
# Mutants no test can observe. Matched by file, change and function, never by line, so an edit elsewhere keeps them
# matching; a function made generic matches with or without its parameters. `just mutants-stale` lists the patterns
# that match nothing.
exclude_re = [
  # The peer API stops with the process: without `stop`, the runtime drops its task a moment later, and no peer
  # outlives the agent in a test.
  'serve\.rs:\d+:\d+: replace Peers::stop with \(\)$',
  # `Default::default()` of a body is an empty body: the same bytes and headers.
  'serve\.rs:\d+:\d+: replace empty -> Body with Default::default\(\)$',
  # A leaked empty `Vec` is the same empty list of hints.
  'node\.rs:\d+:\d+: replace <impl ClientCertVerifier for Verifier>::root_hint_subjects -> &\[DistinguishedName\] with Vec::leak\(Vec::new\(\)\)$',
  # The load generator's agents joining at once, or not stopped before the reflector is: the small run of
  # `apps/speculaire/tests/load.rs` meets its targets either way, and D33's scale shows them in the nightly run.
  'agents\.rs:\d+:\d+: replace \+ with - in Fleet::connect$',
  'agents\.rs:\d+:\d+: replace Connected::stop with \(\)$',
  # A pacer owing about a million acts a second: the lookups it spawns take the runner's memory before nextest's 2
  # minutes, and the runner dies. `a_pacer_acts_its_rate_times_a_second_even_when_a_tick_owes_several` catches each
  # alone.
  'agents\.rs:\d+:\d+: replace (/ with [*%]|\* with \+) in pace$',
  # The settling log every 5 s.
  'node\.rs:\d+:\d+: replace >= with < in Agent::settled$',
  # A reflector settled at once, or dropped instead of stopped, which `kill_on_drop` kills: the small run goes on and
  # meets its loose targets. The settling logs and the exit status of D33's run tell them apart.
  'node\.rs:\d+:\d+: replace Agent::settled -> anyhow::Result<Option<Duration>> with Ok\(Some\(Default::default\(\)\)\)$',
  'node\.rs:\d+:\d+: replace Agent::stop -> anyhow::Result<\(\)> with Ok\(\(\)\)$',
  # The engine's one-line calls into discovery: `crates/artifacts` tests `Discovery::discover` and `again`, the e2e test
  # of an unverifiable verdict sees the engine call `discover`, and an engine test of them would need a registry (D151).
  'engine\.rs:\d+:\d+: replace <impl Discover for Discovery>::(discover|again) -> Result<\(\), Error> with Ok\(\(\)\)$',
  # A target with exactly as many referrers as the cap: truncating to the cap keeps them all, only a warning differs.
  'discover\.rs:\d+:\d+: replace > with >= in Discovery::bundles$',
  'peers\.rs:\d+:\d+: replace > with >= in Discovery::listed$',
  # inotify's flags are distinct bits: `^` sets the same ones as `|`.
  'crio/images\.rs:\d+:\d+: replace \| with \^ in watch_blocking$',
  # The stand-in `watch` off Linux: Linux, where mutants run, compiles it out, and elsewhere `Lost` has no `Default`.
  'crio/images\.rs:\d+:\d+: replace watch -> Lost with Default::default\(\)$',
  # The children of more roots forgotten: a cache, read again from the store or the node as a manifest is fetched.
  'follow\.rs:\d+:\d+: replace \|\| with && in collect$',
  # A grace that ends at the very nanosecond of a collection: the mark goes at this one or the next.
  'store\.rs:\d+:\d+: replace > with >= in Store::graced$',
]
# `e2e/` runs only against a kind cluster (`just e2e`), so no mutant of it is run; `crates/fake-runtime/`,
# `crates/pki/src/testing.rs` and `crates/reflect/src/bench.rs` are test and benchmark support (D87, D95, D104).
# `apps/loadgen/` is `speculaire_load::run` behind flags, run by the `load` workflow (D104). `fuzz/` is a workspace of
# its own, which cargo-mutants never lists.
exclude_globs = [
  "e2e/**",
  "crates/fake-runtime/**",
  "crates/pki/src/testing.rs",
  "crates/reflect/src/bench.rs",
  "apps/loadgen/**",
]
