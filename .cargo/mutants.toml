# Ported from dedens `.cargo/mutants.toml` at v0.1.0-131-gfd00747 (D103 there; D27, D74 here).
#
# cargo-mutants: run with `just mutants` or `just mutants-diff`, never bare.
# Test with every feature, so no test behind a feature goes unseen.
all_features = true
# nextest, as `just check` (D72): a test that hangs on a mutant is killed after 2 minutes and counts as caught.
test_tool = "nextest"
# Every package's tests run for each mutant: `apps/speculaire/tests/agent.rs` starts the binary and is what sees
# `crates/agent/src/serve.rs` and `systemd.rs`, which that package's own tests never reach (D74).
test_workspace = true
# Mutants no test can observe. Matched by file, change and function, never by line, so an edit elsewhere keeps them
# matching; a function made generic matches with or without its parameters. `just mutants-stale` lists the patterns
# that match nothing.
exclude_re = [
  # The mirror stops with the process: without `stop`, the runtime drops its task a moment later, and no client
  # outlives the agent in a test.
  'serve\.rs:\d+:\d+: replace Mirror::stop with \(\)$',
  # `Default::default()` of a body is an empty body: the same bytes and headers.
  'serve\.rs:\d+:\d+: replace empty -> Body with Default::default\(\)$',
  # A leaked empty `Vec` is the same empty list of hints.
  'node\.rs:\d+:\d+: replace <impl ClientCertVerifier for Verifier>::root_hint_subjects -> &\[DistinguishedName\] with Vec::leak\(Vec::new\(\)\)$',
  # tokio-rustls writes its records to the socket within `poll_write`, and a TCP flush does nothing; a link not shut
  # down is closed when dropped, so its client sees the end all the same.
  'server\.rs:\d+:\d+: replace <impl AsyncWrite for Link>::poll_(flush|shutdown) -> Poll<io::Result<\(\)>> with Poll::from\(Ok\(\(\)\)\)$',
]
# `e2e/` runs only against a kind cluster (`just e2e`), so no mutant of it is run; `crates/fake-runtime/` and
# `crates/pki/src/testing.rs` are test support (D87, D95). `fuzz/` is a workspace of its own, which cargo-mutants
# never lists.
exclude_globs = [
  "e2e/**",
  "crates/fake-runtime/**",
  "crates/pki/src/testing.rs",
]
