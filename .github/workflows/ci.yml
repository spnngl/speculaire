name: ci

# The check (`just check`), the musl binaries, the dependency checks, the oracle and e2e, on each pull request and
# each push to main; `required` is the one check the ruleset requires (D27, D48). Jobs ported from dedens `.github/workflows/ci.yml` at v0.1.0-131-gfd00747.
on:
  push:
    branches:
      - main
  pull_request:

# A new push to a pull request cancels its running checks; each commit on main gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job grants only what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # On the runner, with prebuilt tools at build/Containerfile's versions (D58).
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # renovate: datasource=crate depName=taplo-cli
      TAPLO_VERSION: "0.10.0"
      # renovate: datasource=crate depName=typos-cli
      TYPOS_VERSION: "1.51.1"
      # renovate: datasource=crate depName=cargo-shear
      CARGO_SHEAR_VERSION: "1.14.0"
      # renovate: datasource=crate depName=cargo-nextest
      CARGO_NEXTEST_VERSION: "0.9.151"
      # protoc: the protobuf exposition of `/metrics` compiles its .proto at build time (D34).
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf
      PROTOC_VERSION: "36.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      # The pinned stable and nightly, before rust-cache: its key includes the rustc version.
      - run: just toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # `just check` also builds fuzz/, a workspace of its own.
          workspaces: |
            .
            fuzz
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: taplo@${{ env.TAPLO_VERSION }},typos@${{ env.TYPOS_VERSION }},cargo-shear@${{ env.CARGO_SHEAR_VERSION }},cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }},protoc@3.${{ env.PROTOC_VERSION }}
      - run: just check

  # Line coverage, in the log and for the ruleset's `code_coverage` rule: pushes to main upload the baseline, pull
  # requests the coverage it compares. The rule does not wait for an upload, so `required` needs this job (D72).
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      code-quality: write
    env:
      # renovate: datasource=crate depName=cargo-nextest
      CARGO_NEXTEST_VERSION: "0.9.151"
      # renovate: datasource=crate depName=cargo-llvm-cov
      CARGO_LLVM_COV_VERSION: "0.9.1"
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf
      PROTOC_VERSION: "36.2"
    steps:
      # The pull request's head, not the merge commit: the report's lines must be the head's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }},cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }},protoc@3.${{ env.PROTOC_VERSION }}
      - run: just cov --cobertura --output-path target/cobertura.xml
      # Pull requests from forks get no upload: the action skips them. The upload API answers 404 to this repository
      # (D72): a failed upload warns, until it accepts reports.
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: target/cobertura.xml
          language: Rust
          label: code-coverage/llvm-cov
          fail-on-error: false

  # The static-PIE binaries we ship, natively on each architecture in the build image (D13, D57). `just musl` fails
  # unless the binary is static-pie and carries its cargo-auditable list. Later jobs (e2e) take the artifact.
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      - env:
          TARGET: ${{ matrix.target }}
        run: just musl "$TARGET"
      # The distribution-spec conformance suite against the mirror of this binary (D85).
      - run: just conformance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speculaire-${{ matrix.target }}
          path: target/musl/${{ matrix.target }}/speculaire
          if-no-files-found: error
          retention-days: 7

  # Build matrix and dependency checks: platform-independent, Linux only.
  deps:
    strategy:
      fail-fast: false
      matrix:
        recipe: [hack, msrv, minimal-versions, deny]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # renovate: datasource=crate depName=cargo-hack
      CARGO_HACK_VERSION: "0.6.45"
      # renovate: datasource=crate depName=cargo-deny
      CARGO_DENY_VERSION: "0.20.2"
      # renovate: datasource=crate depName=cargo-vet
      CARGO_VET_VERSION: "0.10.3"
      # protoc: the protobuf exposition of `/metrics` compiles its .proto at build time (D34).
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf
      PROTOC_VERSION: "36.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      # The pinned nightly also serves `-Z direct-minimal-versions`.
      - run: just toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.recipe }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-hack@${{ env.CARGO_HACK_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-vet@${{ env.CARGO_VET_VERSION }},protoc@3.${{ env.PROTOC_VERSION }}
      - env:
          RECIPE: ${{ matrix.recipe }}
        run: just "$RECIPE"
      # cargo-vet rides on the `deny` leg rather than a job of its own, for the runner budget (D71).
      - if: matrix.recipe == 'deny'
        run: just vet

  # The suites on a kind cluster per leg of D63's matrix, natively on each architecture, with the binary this run built
  # (D27).
  e2e:
    name: e2e (${{ matrix.leg.runtime }} ${{ matrix.leg.version }}, kubernetes ${{ matrix.leg.kubernetes }}, ${{ matrix.platform.os }})
    needs: musl
    strategy:
      fail-fast: false
      matrix:
        leg:
          - { runtime: containerd, version: "2.3", kubernetes: "1.37" }
          - { runtime: containerd, version: "2.4", kubernetes: "1.37" }
          - { runtime: containerd, version: "2.4", kubernetes: "1.36" }
          - { runtime: containerd, version: "2.4", kubernetes: "1.35" }
          - { runtime: crio, version: "1.37", kubernetes: "1.37" }
          - { runtime: crio, version: "1.36", kubernetes: "1.36" }
          - { runtime: crio, version: "1.35", kubernetes: "1.35" }
        platform:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      # The pinned stable, before rust-cache: its key includes the rustc version.
      - run: rustup toolchain install
      # Before the artifact: restoring a cache replaces target/.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: speculaire-${{ matrix.platform.target }}
          path: target/musl/${{ matrix.platform.target }}
      # Artifacts drop the executable bit.
      - env:
          TARGET: ${{ matrix.platform.target }}
        run: chmod +x "target/musl/$TARGET/speculaire"
      - env:
          RUNTIME: ${{ matrix.leg.runtime }}
          VERSION: ${{ matrix.leg.version }}
          KUBERNETES: ${{ matrix.leg.kubernetes }}
        run: just e2e "$RUNTIME" "$VERSION" "$KUBERNETES"
      # The same suites on a dual-stack cluster (D94).
      - env:
          RUNTIME: ${{ matrix.leg.runtime }}
          VERSION: ${{ matrix.leg.version }}
          KUBERNETES: ${{ matrix.leg.kubernetes }}
          SPECULAIRE_E2E_IP_FAMILY: dual
        run: just e2e "$RUNTIME" "$VERSION" "$KUBERNETES"
      # The journals `just e2e` saved before deleting a cluster whose suites failed.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-journals-${{ matrix.leg.runtime }}-${{ matrix.leg.version }}-k${{ matrix.leg.kubernetes }}-${{ matrix.platform.os }}
          path: target/e2e/journals
          if-no-files-found: ignore
          retention-days: 7

  # The Go test oracle (D29): built, vetted and tested in the pinned Go image, then the Rust differential tests that ask
  # it (D70) on the runner.
  oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # protoc: the workspace builds the agent, which compiles its .proto at build time (D34).
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf
      PROTOC_VERSION: "36.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: protoc@3.${{ env.PROTOC_VERSION }}
      - run: just oracle

  # The one check the ruleset requires (D48): matrix legs are named after their values, so requiring them would break
  # whenever a matrix changes.
  required:
    if: always()
    needs: [check, coverage, musl, deps, oracle, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "::error::\(.key): \(.value.result)"' <<< "$NEEDS")
          [ -z "$failed" ] || { echo "$failed"; exit 1; }
