# The suites on a kind cluster per leg of D63's matrix, natively on each architecture, with the binary the calling run
# built as the artifact `speculaire-<target>` (D27). ci.yml and e2e-nightly.yml call it; the matrix is here only.
name: e2e

on:
  workflow_call:
    inputs:
      install:
        description: How the agents run, SPECULAIRE_E2E_INSTALL (D208)
        type: string
        required: true
      exclude:
        description: 'The matrix''s exclude, as JSON: `[{"leg":{"newest":false}}]` keeps the newest containerd and CRI-O (D113)'
        type: string
        default: "[]"
      dual:
        description: Whether each leg runs the suites again on a dual-stack cluster (D94, D190)
        type: boolean
        default: false

permissions: {}

jobs:
  e2e:
    name: ${{ inputs.install }} (${{ matrix.leg.runtime }} ${{ matrix.leg.version }}, kubernetes ${{ matrix.leg.kubernetes }}, ${{ matrix.platform.os }})
    strategy:
      fail-fast: false
      matrix:
        leg:
          - { runtime: containerd, version: "2.3", kubernetes: "1.37", newest: false }
          - { runtime: containerd, version: "2.4", kubernetes: "1.37", newest: true }
          - { runtime: containerd, version: "2.4", kubernetes: "1.36", newest: false }
          - { runtime: containerd, version: "2.4", kubernetes: "1.35", newest: false }
          - { runtime: crio, version: "1.37", kubernetes: "1.37", newest: true }
          - { runtime: crio, version: "1.36", kubernetes: "1.36", newest: false }
          - { runtime: crio, version: "1.35", kubernetes: "1.35", newest: false }
        platform:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
        exclude: ${{ fromJSON(inputs.exclude) }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # protoc: the suites read the recorded fixtures through speculaire-artifacts, whose runtime client compiles its
      # .proto at build time (D141).
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf
      PROTOC_VERSION: "36.2"
      SPECULAIRE_E2E_INSTALL: ${{ inputs.install }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      # The pinned stable, before rust-cache: its key includes the rustc version.
      - run: rustup toolchain install
      # Before the artifact: restoring a cache replaces target/.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: protoc@3.${{ env.PROTOC_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: speculaire-${{ matrix.platform.target }}
          path: target/musl/${{ matrix.platform.target }}
      # Artifacts drop the executable bit.
      - env:
          TARGET: ${{ matrix.platform.target }}
        run: chmod +x "target/musl/$TARGET/speculaire"
      # The suites, then the catalog check over their scrapes (D181).
      - env:
          RUNTIME: ${{ matrix.leg.runtime }}
          VERSION: ${{ matrix.leg.version }}
          KUBERNETES: ${{ matrix.leg.kubernetes }}
        run: just e2e "$RUNTIME" "$VERSION" "$KUBERNETES"
      - if: inputs.dual
        env:
          RUNTIME: ${{ matrix.leg.runtime }}
          VERSION: ${{ matrix.leg.version }}
          KUBERNETES: ${{ matrix.leg.kubernetes }}
          SPECULAIRE_E2E_IP_FAMILY: dual
        run: just e2e "$RUNTIME" "$VERSION" "$KUBERNETES"
      # The journals, or the pods' logs, `just e2e` saved before deleting a cluster whose suites failed, and the scrapes
      # of the catalog check.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-journals-${{ inputs.install }}-${{ matrix.leg.runtime }}-${{ matrix.leg.version }}-k${{ matrix.leg.kubernetes }}-${{ matrix.platform.os }}
          path: |
            target/e2e/journals
            target/e2e/scrapes
          if-no-files-found: ignore
          retention-days: 7
