# Ported from dedens `.github/workflows/deep.yml` at v0.1.0-131-gfd00747 (D144 there; D27, D76 here).
name: deep

# The slow checks of each pull request, informational and outside `required` as `mutants.yml` is (D48): `careful` runs
# the tests on a checked standard library under AddressSanitizer (`just careful address`, D76); `shuttle` runs the
# reflector's index under Shuttle's random schedules (`just shuttle`, D97); `valgrind` runs the reflector under a short
# load in Valgrind's memcheck and DHAT, then a peer pull in DHAT (`just valgrind`, D104, D116).
on:
  pull_request:
    # Only what can change what the tests do.
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - Cargo.lock
      - rust-toolchain.toml
      - justfile
      - build/Containerfile
      - .github/workflows/deep.yml

# A new push cancels the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job grants only what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job for every package but `e2e`, which needs a kind cluster (D76).
  careful:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # renovate: datasource=crate depName=cargo-careful
      CARGO_CAREFUL_VERSION: "0.4.10"
      # protoc: the protobuf exposition of `/metrics` compiles its .proto at build time (D34).
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf
      PROTOC_VERSION: "36.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      - run: just toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target/careful
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-careful@${{ env.CARGO_CAREFUL_VERSION }},protoc@3.${{ env.PROTOC_VERSION }}
      - run: just careful address

  shuttle:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # protoc: the reflector's .proto and the protobuf exposition of `/metrics` compile at build time (D34, D97).
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf
      PROTOC_VERSION: "36.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      # The stable of rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target/shuttle
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: protoc@3.${{ env.PROTOC_VERSION }}
      - run: just shuttle

  # In the profile image of build/Containerfile, which has protoc and Valgrind (D116); the build starts cold each run.
  valgrind:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      - run: just valgrind
      # DHAT's heap profiles, for https://nnethercote.github.io/dh_view/dh_view.html.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhat
          path: target/valgrind/dhat
          if-no-files-found: error
          retention-days: 30
