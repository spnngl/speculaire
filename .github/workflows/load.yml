name: load

# D33's load against one reflector, nightly, natively on each architecture (`just load`, D104): a missed target fails
# the run, and the job summary holds the measures.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: Arguments to speculaire-loadgen, as `--rss-mib 64`
        type: string
        default: ""

# Each job grants only what it needs.
permissions: {}

jobs:
  load:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      - env:
          TARGET: ${{ matrix.target }}
        run: just musl "$TARGET"
      # The report goes to the job summary, a missed target or not.
      # The input reaches the shell as data, split into words with no glob.
      - shell: bash
        env:
          ARGS: ${{ inputs.args }}
        run: |
          set -o pipefail
          read -ra args <<<"$ARGS"
          just load "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
