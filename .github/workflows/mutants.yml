# Ported from dedens `.github/workflows/mutants.yml` at v0.1.0-131-gfd00747 (D142 there; D27, D74 here).
name: mutants

# Mutation testing of the code a pull request changes (`just mutants-diff`), in shards: informational, outside
# `required` (D48). Whole-workspace runs stay local (`just mutants`).
on:
  pull_request:
    # Only what can change a mutant or its outcome.
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - Cargo.lock
      - .cargo/mutants.toml
      - .config/nextest.toml
      - .github/workflows/mutants.yml
      - justfile

# A new push cancels the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job grants only what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=crate depName=cargo-mutants
  CARGO_MUTANTS_VERSION: "27.1.0"

jobs:
  # Counts the diff's mutants, without building, and splits them in shards of about 40, up to 4 (the account runs 20
  # jobs at once, and ci.yml starts about 31). Each shard reads this job's diff, so all agree on the list.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff starts where the branch left its base.
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      # The stable of rust-toolchain.toml: listing reads `cargo metadata`.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}
      # `shell: bash` adds pipefail: a listing that fails stays red through `wc`, not 0 mutants.
      - id: plan
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mutants=$(just mutants-diff "origin/$BASE_REF" --list | wc -l)
          count=$(( (mutants + 39) / 40 ))
          count=$(( count > 4 ? 4 : count ))
          echo "$mutants mutants, $count shards" >> "$GITHUB_STEP_SUMMARY"
          # About 5 s a mutant (D74): past 4000, shards may reach their 350 minutes (hosted runners stop at 360).
          if (( mutants > 4000 )); then echo "::warning::$mutants mutants: shards may time out"; fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          # A matrix may not be empty, even in a job its `if` skips.
          echo "shards=$(jq -nc --argjson n "$count" '[range([$n, 1] | max)]')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-diff
          path: target/mutants/branch.diff

  # The exclusions of .cargo/mutants.toml that match no mutant or file: a moved or renamed function leaves its
  # pattern behind.
  stale:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # renovate: datasource=crate depName=taplo-cli
      TAPLO_VERSION: "0.10.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      # The stable of rust-toolchain.toml: listing reads `cargo metadata`.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }},taplo@${{ env.TAPLO_VERSION }}
      - run: just mutants-stale

  # A shard fails on a missed mutant or a timeout (exit 2 or 3), as a whole run would.
  shard:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      # renovate: datasource=crate depName=cargo-nextest
      CARGO_NEXTEST_VERSION: "0.9.151"
      # protoc: the protobuf exposition of `/metrics` compiles its .proto at build time (D34).
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf
      PROTOC_VERSION: "36.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-diff
          path: diff
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=crate depName=just
          just-version: "1.59.0"
      # The stable of rust-toolchain.toml; the pinned nightly serves no mutant.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target/mutants/target
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }},cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }},protoc@3.${{ env.PROTOC_VERSION }}
      # The oracle the differential tests ask (D79): without it they skip, and no mutant of a port is seen. The binary is
      # static, and the mutated tree finds it by its absolute path.
      - run: just oracle-build
      # No baseline: ci.yml's `just check` runs the unmutated tests of the same commit.
      - env:
          SHARD: ${{ matrix.shard }}
          COUNT: ${{ needs.plan.outputs.count }}
          SPECULAIRE_ORACLE: ${{ github.workspace }}/target/oracle/speculaire-oracle
        run: just mutants --in-diff "$PWD/diff/branch.diff" --shard "$SHARD/$COUNT" --baseline=skip
      - name: Keep the outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out-${{ matrix.shard }}
          path: target/mutants/mutants.out

  # The missed and timed-out mutants of every shard, on the run's summary page.
  summary:
    needs: [plan, shard]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-out-*
          path: out
      - run: |
          for kind in missed timeout; do
            {
              echo "## ${kind^}"
              echo "\`\`\`"
              cat out/*/"$kind.txt" 2>/dev/null | sort || true
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done
